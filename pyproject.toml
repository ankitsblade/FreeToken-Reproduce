[project]
name = "freetoken-experiments"
version = "0.1.0"
description = "Reproduction and pruning experiments using an external FreeToken runtime"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.6",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "matplotlib==3.11.0",
  "reportlab==5.0.1",
  "pillow==12.3.0",
  "python-pptx>=1,<2",
  "huggingface-hub==1.33.0",
  "safetensors==0.8.0",
]

[tool.uv]
package = false
constraint-dependencies = [
  "contourpy==1.3.3",
  "filelock==4.0.7",
  "fonttools==4.63.0",
  "hf-xet==1.6.0",
  "kiwisolver==1.5.0",
  "pyparsing==3.3.2",
]
